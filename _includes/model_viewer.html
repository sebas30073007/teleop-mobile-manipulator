<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
<model-viewer
  src="{{ include.src }}"
  alt="{{ include.alt | default: 'Modelo 3D interactivo' }}"
  camera-controls
  auto-rotate
  shadow-intensity="1"
  style="width:100%;height:500px;background:#f5f6fa;border-radius:8px;margin:1.5rem 0;display:block;">
</model-viewer>
